name: Yukti CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run API tests
        env:
          ANTHROPIC_API_KEY: test-key-for-ci
          GOOGLE_PLACES_API_KEY: test-key-for-ci
        run: |
          cd server
          python3 -m pytest tests/test_api.py -v

      - name: Run retrieval tests
        run: |
          cd server
          python3 -m pytest tests/test_retrieve.py -v

  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Run clinical logic tests
        run: |
          cd client
          CI=true npm test -- --watchAll=false --testPathPattern="clinical"
